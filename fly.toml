app = "hojpulsen"
primary_region = "arn"

[build]

[env]
  ALLOWED_HOSTS = "hojpulsen.fly.dev,fitbyfear.sammanfatta.se"
  DEBUG = "False"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
